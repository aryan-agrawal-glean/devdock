services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: devdock-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      devdock_network:
        aliases:
          - opensearch.devdock.local
      devdock_infra:
        aliases:
          - opensearch.infra.local
    labels:
      devdock.service: "opensearch"
      devdock.type: "infra"

networks:
  devdock_network:
    external: true
  devdock_infra:
    external: true
