[package]
name = "devdock-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
devdock-core = { path = "../devdock-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
walkdir.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
regex.workspace = true
rust-ini = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
openssl = { workspace = true, features = ["vendored"] }
chrono = { workspace = true }

# GCS native client (replaces gcloud CLI subprocess calls)
google-cloud-storage = "1.8.0"
google-cloud-gax = "1.7.0"

# Compression libraries for seed/full-instance modes
zstd = "0.13"      # Zstandard decompression for .tar.zst
flate2 = "1.0"     # Gzip decompression for .sql.gz
tar = "0.4"        # Tar extraction

# Process group cleanup for spawned proxy / bastion tunnel subprocesses
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
