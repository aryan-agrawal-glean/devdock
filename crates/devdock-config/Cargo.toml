[package]
name = "devdock-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["cloud"]
cloud = [
    "dep:google-cloud-storage",
    "dep:google-cloud-gax",
    "dep:zstd",
    "dep:flate2",
    "dep:tar",
    "dep:rust-ini",
    "dep:reqwest",
    "dep:openssl",
    "dep:chrono",
]

[dependencies]
devdock-core = { path = "../devdock-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
walkdir.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
regex.workspace = true
tracing = { workspace = true }

# Cloud-only dependencies (behind "cloud" feature)
rust-ini = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
openssl = { workspace = true, features = ["vendored"], optional = true }
chrono = { workspace = true, optional = true }
google-cloud-storage = { version = "1.8.0", optional = true }
google-cloud-gax = { version = "1.7.0", optional = true }
zstd = { version = "0.13", optional = true }
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
