[package]
name = "devdock-diagnostics"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
tracing = "0.1"
chrono = "0.4"
sysinfo = "0.30"
zip = "0.6"
base64 = "0.21"
dialoguer = "0.11"
colored = "2.1"
dirs = "5.0"
uuid = { version = "1.6", features = ["v4"] }
