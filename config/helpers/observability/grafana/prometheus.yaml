global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "crawler"
    static_configs:
      - targets: ["host.docker.internal:6060"]
    metrics_path: "/metrics"

  - job_name: "docbuilder"
    static_configs:
      - targets: [ "host.docker.internal:6061" ]
    metrics_path: "/metrics"
