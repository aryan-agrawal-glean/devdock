services:
  sql:
    image: postgres:16
    container_name: devdock-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      devdock_network:
        aliases: [sql.devdock.local]
      devdock_infra:
        aliases: [sql.infra.local]
    labels:
      devdock.service: "sql"
      devdock.type: "infra"

networks:
  devdock_network:
    external: true
  devdock_infra:
    external: true
