services:
  sql:
    image: postgres:16
    container_name: devdock-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      devdock_network:
        aliases:
          - sql.devdock.local
      devdock_infra:
        aliases:
          - sql.infra.local
    labels:
      devdock.service: "sql"
      devdock.type: "infra"

networks:
  devdock_network:
    external: true
  devdock_infra:
    external: true
