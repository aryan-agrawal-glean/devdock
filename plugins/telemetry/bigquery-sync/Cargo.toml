[package]
name = "devdock-plugin-bigquery-sync"
version = "0.1.0"
edition = "2021"
description = "DevDock plugin: sync telemetry to BigQuery"
license = "MIT OR Apache-2.0"

[[bin]]
name = "devdock-plugin-bigquery-sync"
path = "src/main.rs"

[dependencies]
devdock-plugin-sdk = { path = "../../sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
chrono = { version = "0.4", features = ["serde"] }
