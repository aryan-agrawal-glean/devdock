[package]
name = "devdock-plugin-s3-storage"
version = "0.1.0"
edition = "2021"
description = "DevDock plugin: read config from AWS S3"
license = "MIT OR Apache-2.0"

[[bin]]
name = "devdock-plugin-s3-storage"
path = "src/main.rs"

[dependencies]
devdock-plugin-sdk = { path = "../../sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
