[package]
name = "devdock-plugin-config-generator"
version = "0.1.0"
edition = "2021"
description = "DevDock plugin: Glean config generation (devdock.ini + temp_profile.yaml)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "devdock-plugin-config-generator"
path = "src/main.rs"

[dependencies]
devdock-plugin-sdk = { path = "../../sdk" }
devdock-config = { path = "../../../crates/devdock-config" }
devdock-core = { path = "../../../crates/devdock-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
