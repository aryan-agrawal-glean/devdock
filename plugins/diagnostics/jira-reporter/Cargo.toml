[package]
name = "devdock-plugin-jira-reporter"
version = "0.1.0"
edition = "2021"
description = "DevDock plugin: report bugs to Jira"
license = "MIT OR Apache-2.0"

[[bin]]
name = "devdock-plugin-jira-reporter"
path = "src/main.rs"

[dependencies]
devdock-plugin-sdk = { path = "../../sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
base64 = "0.21"
