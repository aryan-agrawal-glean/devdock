name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.7)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Update Version and Create Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Cargo.toml version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Update version in workspace.package section
          awk -v version="$VERSION" '
            /^\[workspace\.package\]/ { in_section=1 }
            /^\[/ && !/^\[workspace\.package\]/ { in_section=0 }
            in_section && /^version = / {
              print "version = \"" version "\""
              next
            }
            { print }
          ' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - name: Commit version bump
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git add Cargo.toml

          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git push
          else
            echo "Version already set to $VERSION, skipping commit"
          fi

      - name: Create and push tag
        id: create-tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v$VERSION"

          # Check if tag already exists locally or remotely
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally"
          elif git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists on remote"
            git fetch --tags
          else
            echo "Creating and pushing tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: devdock-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: devdock-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: devdock-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: devdock-macos-arm64

    steps:
      - name: Get checkout ref
        id: get-ref
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ref=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.get-ref.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1

      - name: Get version tag
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.name }}-${{ steps.get-tag.outputs.tag }}.tar.gz devdock
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}-${{ steps.get-tag.outputs.tag }}.tar.gz

  release:
    name: Create Release
    needs: [prepare-release, build]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get release tag
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.get-tag.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
