name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            binary_name: devdock
            artifact_name: devdock-macos-arm64
          
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: devdock
            artifact_name: devdock-linux-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p artifacts
          tar czf artifacts/${{ matrix.artifact_name }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}.tar.gz

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          # Extract version from tag (refs/tags/v0.1.0 -> v0.1.0)
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cd artifacts
          
          # Extract and rename each artifact
          for dir in */; do
            cd "$dir"
            tar xzf *.tar.gz
            platform=$(basename "$dir")
            mv devdock "../../release/${platform}-${{ steps.version.outputs.version }}"
            cd ..
          done
          
          # Generate checksums
          cd ../release
          shasum -a 256 * > checksums.txt
          
          # List files for debugging
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## DevDock ${{ github.ref_name }}
            
            🎉 New release of DevDock!
            
            ### ⚡ Quick Install
            
            #### macOS (Apple Silicon - M1/M2/M3)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/devdock-macos-arm64-${{ github.ref_name }} -o devdock
            chmod +x devdock && sudo mv devdock /usr/local/bin/
            ```
            
            #### Linux (x86_64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/devdock-linux-x86_64-${{ github.ref_name }} -o devdock
            chmod +x devdock && sudo mv devdock /usr/local/bin/
            ```
            
            ### Verify Installation
            ```bash
            devdock --version
            ```
            
            ### 📚 Documentation
            
            See [README](https://github.com/${{ github.repository }}) for full documentation.
            
            ### 🔒 Checksums
            
            See `checksums.txt` for SHA256 verification.
            
            ---
            
            **Note:** Intel Mac support (x86_64) has been discontinued as macOS-13 runners are retired. Apple Silicon Macs can run x86_64 binaries via Rosetta 2 if needed, but native ARM64 is recommended.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

