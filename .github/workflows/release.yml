name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.7)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BRANCH="release/v$VERSION"
          git checkout -b "$BRANCH"

      - name: Update Cargo.toml version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Update version in workspace.package section
          awk -v version="$VERSION" '
            /^\[workspace\.package\]/ { in_section=1 }
            /^\[/ && !/^\[workspace\.package\]/ { in_section=0 }
            in_section && /^version = / {
              print "version = \"" version "\""
              next
            }
            { print }
          ' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - name: Commit version bump
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git add Cargo.toml
          git commit -m "chore: bump version to $VERSION"

      - name: Push release branch
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BRANCH="release/v$VERSION"
          git push origin "$BRANCH"

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PR_URL=$(gh pr create \
            --title "chore: bump version to $VERSION" \
            --body "🤖 Automated version bump to **v$VERSION**

          ## Changes
          - Update workspace version in \`Cargo.toml\` to $VERSION

          ## Next Steps
          1. Review and merge this PR
          2. After merge, the release will be created automatically with tag \`v$VERSION\`

          ---
          _This PR was created automatically by the [Release workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_" \
            --label "release" \
            --base main)

          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Created PR: $PR_URL"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Only run on tag pushes (after release PR is merged and tagged)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: devdock-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: devdock-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: devdock-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: devdock-macos-arm64

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1

      - name: Get version tag
        id: get-tag
        run: |
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.name }}-${{ steps.get-tag.outputs.tag }}.tar.gz devdock
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}-${{ steps.get-tag.outputs.tag }}.tar.gz

  release:
    name: Create Release
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get release tag
        id: get-tag
        run: |
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.get-tag.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
