name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.optional || false }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            binary_name: devdock
            artifact_name: devdock-macos-arm64
          
          - os: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
            binary_name: devdock
            artifact_name: devdock-macos-x86_64
          
          - os: ubuntu-latest
            platform: linux-x86_64-glibc239
            target: x86_64-unknown-linux-gnu
            binary_name: devdock
            artifact_name: devdock-linux-x86_64-glibc239
            
          - os: ubuntu-latest
            platform: linux-x86_64-glibc231
            target: x86_64-unknown-linux-gnu
            binary_name: devdock
            artifact_name: devdock-linux-x86_64-glibc231
            container: ubuntu:20.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux in container)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev
          
      - name: Install dependencies (Linux native)
        if: runner.os == 'Linux' && !matrix.container
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.binary_name }}
          mv ${{ matrix.artifact_name }}.tar.gz ${{ github.workspace }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cd artifacts
          
          # Extract and rename each artifact
          for dir in */; do
            cd "$dir"
            tar xzf *.tar.gz
            platform=$(basename "$dir")
            version="${GITHUB_REF#refs/tags/}"
            mv devdock "../../release/${platform}-${version}"
            cd ..
          done
          
          # Generate checksums
          cd ../release
          shasum -a 256 * > checksums.txt
          
          # List files for debugging
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## DevDock ${{ github.ref_name }}
            
            🎉 First release of DevDock in Rust!
            
            ### ⚡ Quick Install
            
            #### macOS (Apple Silicon)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/devdock-macos-arm64-${{ github.ref_name }} -o devdock
            chmod +x devdock && sudo mv devdock /usr/local/bin/
            ```
            
            #### macOS (Intel)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/devdock-macos-x86_64-${{ github.ref_name }} -o devdock
            chmod +x devdock && sudo mv devdock /usr/local/bin/
            ```
            
            #### Linux (x86_64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/devdock-linux-x86_64-${{ github.ref_name }} -o devdock
            chmod +x devdock && sudo mv devdock /usr/local/bin/
            ```
            
            ### Verify Installation
            ```bash
            devdock --version  # Should output: devdock 0.1.0
            ```
            
            ### 📚 Documentation
            
            See [README](https://github.com/${{ github.repository }}) for full documentation.
            
            ### 🔒 Checksums
            
            See `checksums.txt` for SHA256 verification.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

