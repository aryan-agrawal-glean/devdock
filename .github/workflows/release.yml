name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.7)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Create PR with version bump using GitHub API
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e

          BRANCH="release/v${VERSION}"

          # Get current Cargo.toml content from main branch
          CURRENT_CONTENT=$(gh api /repos/${{ github.repository }}/contents/Cargo.toml \
            --jq '.content' | base64 -d)

          # Update version in workspace.package section
          UPDATED_CONTENT=$(echo "$CURRENT_CONTENT" | awk -v version="$VERSION" '
            /^\[workspace\.package\]/ { in_section=1 }
            /^\[/ && !/^\[workspace\.package\]/ { in_section=0 }
            in_section && /^version = / {
              print "version = \"" version "\""
              next
            }
            { print }
          ')

          # Get the SHA of main branch
          MAIN_SHA=$(gh api /repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')

          # Create a blob with the new content (using proper JSON)
          BLOB_SHA=$(gh api /repos/${{ github.repository }}/git/blobs \
            --field content="$UPDATED_CONTENT" \
            --field encoding=utf-8 \
            --jq '.sha')

          # Get the current tree
          BASE_TREE=$(gh api /repos/${{ github.repository }}/git/commits/$MAIN_SHA --jq '.tree.sha')

          # Create a new tree with updated Cargo.toml (using raw JSON)
          TREE_SHA=$(echo "{
            \"base_tree\": \"$BASE_TREE\",
            \"tree\": [
              {
                \"path\": \"Cargo.toml\",
                \"mode\": \"100644\",
                \"type\": \"blob\",
                \"sha\": \"$BLOB_SHA\"
              }
            ]
          }" | gh api /repos/${{ github.repository }}/git/trees --input - --jq '.sha')

          # Create a commit (automatically signed by GitHub when using App token!)
          # NOTE: Do NOT set author/committer - let GitHub set them automatically for signing
          COMMIT_SHA=$(echo "{
            \"message\": \"chore: bump version to ${VERSION}\",
            \"tree\": \"$TREE_SHA\",
            \"parents\": [\"$MAIN_SHA\"]
          }" | gh api /repos/${{ github.repository }}/git/commits --input - --jq '.sha')

          # Delete branch if it exists (ignore 404 if it doesn't exist)
          gh api /repos/${{ github.repository }}/git/refs/heads/$BRANCH -X DELETE 2>&1 | grep -v "404" || true

          # Create branch reference
          echo "{
            \"ref\": \"refs/heads/$BRANCH\",
            \"sha\": \"$COMMIT_SHA\"
          }" | gh api /repos/${{ github.repository }}/git/refs --input -

          # Create pull request
          PR_URL=$(gh pr create \
            --title "chore: bump version to ${VERSION}" \
            --body "🤖 Automated version bump to **v${VERSION}**

          ## Changes
          - Update workspace version in \`Cargo.toml\` to ${VERSION}

          ## Next Steps
          1. Review and merge this PR
          2. After merge, the release will be created automatically with tag \`v${VERSION}\`

          ---
          _This PR was created automatically by the [Release workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_" \
            --base main \
            --head "$BRANCH" \
            --label release \
            --assignee ${{ github.actor }})

          echo "✅ Pull request created: $PR_URL"
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Only run on tag pushes (after release PR is merged and tagged)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: devdock-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: devdock-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: devdock-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: devdock-macos-arm64

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p devdock-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1

      - name: Get version tag
        id: get-tag
        run: |
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.name }}-${{ steps.get-tag.outputs.tag }}.tar.gz devdock
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}-${{ steps.get-tag.outputs.tag }}.tar.gz

  release:
    name: Create Release
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get release tag
        id: get-tag
        run: |
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.get-tag.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
